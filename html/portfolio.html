<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="../style/portfolio.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<nav>
    <ul>
        <li><img class="icon" src="/imgs/user.png" height="24" width="24"></li>
    </ul>
</nav>

<div class="pnlBtn">
    <div class="portfolioId" id="portfolioId"> ID: </div>
    <div class="portfolioResult" id="portfolioResult"></div>
    <div class="p_n_l_graph">
        <img id="p_n_l_graph" alt="P&L graph" />

    <ul class="portfolioDetails">
        <li class="coins" id="coins"> coins: </li>
        <li class="boughtPrice" id="boughtPrice"> Avg Bought Price: </li>
        <li class="pnl" id="pnl"> Profit and loss: </li>
    </ul>
    <button id="showPnlBtn">Show portfolio</button>
</div>



<script src="../js/portfolio.js"></script>
</body>
</html>
