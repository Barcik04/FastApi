<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="../style/portfolio.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<nav>
    <ul>
        <li><img class="icon" src="/imgs/user.png" height="24" width="24"></li>
    </ul>
</nav>

<div class="pnlBtn">
    <div class="portfolioId" id="portfolioId"> ID: </div>
    <input id="daysVal" placeholder="days" type="text" />
    <div class="portfolioResult" id="portfolioResult"></div>
    <div class="p_n_l_graph">
        <img id="p_n_l_graph" alt="P&L graph" />
    </div>
    <ul class="portfolioDetails">
        <li class="coins" id="coins"> coins: </li>
        <li class="boughtPrice" id="boughtPrice"> Avg Bought Price: </li>
        <li class="pnl" id="pnl"> Profit and loss: </li>
    </ul>
    <button id="showPnlBtn">Show portfolio</button>
    <button id="showPnlGraphBtn"> PNL GRAPH</button>
    <button id="showValGraphBtn"> VAL GRAPH</button>
    <button id="showValGraphMultiCoinBtn"> VAL MULTI COIN GRAPH</button>
    <button id="showPnlGraphPercentageBtn"> PnL PERCENTAGE GRAPH</button>
</div>

<div class="tradeCenter">
    <header> TRADE CENTER</header>
    <div class="createTrade" id="createTrade"> CREATE TRADE
        <input id="coinTrade" placeholder="coin" type="text">
        <input id="quantityTrade" placeholder="quantity" type="text">
        <input id="coinGetTrade" placeholder="coin_get" type="text">
        <input id="quantityGetTrade" placeholder="quantity_get" type="text">
        <input id="receiverPortfolioId" placeholder="portfolio_id to send money to" type="text">
        <button id="createTradeBtn"> CREATE TRADE</button>
    </div>
    <div class="tradeList" id="tradeList"> YOUR TRADES</div>
    <button id="showTrades"> REFRESH TRADES</button>
</div>


<div class="tether">
    <div class="tetherTrans"> BUY/WITHDRAW TETHER
        <input id="tetherQuantity" placeholder="quantity" type="text">
        <button class="buyTether" id="buyTether"> Buy Tether</button>
        <button class="sellTether" id="sellTether"> Sell Tether</button>
    </div>
    <div class="cryptoTrans">BUY/SELL CRYPTO
        <input id="cryptoName" placeholder="crypto_name" type="text">
        <input id="cryptoQuantity" placeholder="quantity" type="text">
        <button class="buyCrypto" id="buyCrypto"> Buy Crypto</button>
        <button class="sellCrypto" id="sellCrypto">Sell Crypto</button>
    </div>
    <div class="transferCoin"> TRANSFER COIN
        <input id="transferCoin" placeholder="coin" type="text">
        <input id="transferCoinQuantity" placeholder="quantity" type="text">
        <input id="transferPortfolioId" placeholder="portfolio_id to send money to" type="text">
        <button class="ProceedTransferBtn" id="ProceedTransferBtn"> TRANSFER</button>
    </div>
</div>


<script src="../js/portfolio.js"></script>
</body>
</html>
