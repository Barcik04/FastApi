<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>register-login</title>
    <link rel="stylesheet" href="../style/register-login.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="log/register">
    <button class="registerBtn">Register</button>
    <button class="loginBtn">Log In</button>
</div>


<div class="login" id="login">
    <h3>Sign in</h3>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="signinBtn">Sign in</button>
    <div id="msg"></div>
</div>


<div class="register" id="register">
    <h3>Register</h3>
    <input id="emailRegister" type="email" placeholder="Email" />
    <input id="passwordRegister" type="password" placeholder="Password" />
    <button id="signinBtnRegister">Register</button>
    <div id="msgRegister"></div>
</div>




<script src="../js/register-login.js"></script>
</body>
</html>
